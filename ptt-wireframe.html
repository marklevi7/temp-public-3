<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>NETS PTT — Map Wireframe</title>
<style>
  html,body{ margin:0; padding:0; }
  :root{
    --ink:#26303a;
    --line:#b8c0c9;
    --line-soft:#dfe4e9;
    --paper:#eef1f4;
    --card:#ffffff;
    --muted:#6b7684;
    --accent:#1f6f8b;
    --accent-soft:#d8ebf1;
    --danger:#c0453a;
    --danger-soft:#f6dcd8;
  }
  /* Light-only by design, matching the reference app screen. */

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    background:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    overflow:hidden;
  }

  .phone{
    width:100%;
    height:100vh;
    height:100dvh;
    background:var(--card);
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }

  /* Top bar */
  .topbar{
    display:flex;
    flex-direction:row-reverse;
    align-items:center;
    gap:10px;
    padding:calc(16px + env(safe-area-inset-top)) 14px 10px;
    flex-shrink:0;
  }
  .avatar{
    width:38px;height:38px;border-radius:50%;
    background:var(--line-soft);
    border:1px solid var(--line);
    flex-shrink:0;
  }
  .search{
    flex:1;
    height:36px;
    border-radius:18px;
    background:var(--paper);
    border:1px solid var(--line);
  }
  .burger{
    width:22px;height:16px;
    flex-shrink:0;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .burger span{display:block;height:2px;background:var(--muted);border-radius:1px;}

  /* Status card */
  .status-card{
    margin:0 14px 10px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    flex-shrink:0;
  }
  .status-row1{
    display:flex;
    flex-direction:row-reverse;
    align-items:center;
    gap:8px;
  }
  .status-icon-btn{
    width:26px;height:26px;border-radius:8px;
    border:1px solid var(--line);
    background:var(--paper);
    flex-shrink:0;
  }
  .status-title{
    flex:1;
    border-radius:6px;
    margin:0 4px;
    font-size:14px;
    font-weight:700;
    text-align:right;
  }
  .status-flag{
    height:20px;
    padding:0 8px;
    border-radius:10px;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:10px;
    display:flex;
    align-items:center;
    font-weight:600;
    white-space:nowrap;
  }
  .status-alert{
    width:26px;height:26px;border-radius:8px;
    background:var(--danger);
    flex-shrink:0;
  }
  .status-sub{
    margin-top:6px;
    font-size:12px;
    color:var(--muted);
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .status-row2{
    display:flex;
    flex-direction:row-reverse;
    align-items:center;
    gap:6px;
    margin-top:10px;
  }
  .pill{
    width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;
    background:var(--line-soft);
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .status-row2 .divider{
    flex:1;
  }

  /* Map area */
  .map{
    position:relative;
    flex:1;
    background:
      repeating-linear-gradient(0deg, var(--line-soft) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, var(--line-soft) 0 1px, transparent 1px 34px),
      var(--paper);
    overflow:hidden;
  }
  .map::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(120deg, transparent 55%, var(--line-soft) 56%, var(--line-soft) 58%, transparent 59%),
      linear-gradient(35deg, transparent 70%, var(--line-soft) 71%, var(--line-soft) 73%, transparent 74%);
    opacity:.7;
  }
  .zone{
    position:absolute;
    top:30%;
    left:34%;
    width:32%;
    height:26%;
    background:var(--accent-soft);
    border:1.5px dashed var(--accent);
    border-radius:4px;
    opacity:.8;
  }
  .pin{
    position:absolute;
    width:30px;height:30px;
    border-radius:8px 8px 8px 2px;
    background:var(--card);
    border:1px solid var(--line);
    transform:rotate(45deg);
  }
  .pin.pin-a{ top:24%; left:44%; }
  .pin.pin-b{ top:38%; left:38%; }

  .map-tools{
    position:absolute;
    top:14px;
    right:14px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .map-tools .tool{
    width:34px;height:34px;
    border-radius:9px;
    background:var(--card);
    border:1px solid var(--line);
  }

  /* Floating actions */
  .fab{
    position:absolute;
    bottom:22px;
    width:60px;height:60px;
    border-radius:50%;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 18px -6px rgba(0,0,0,.4);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .fab-add{
    left:20px;
    background:var(--danger);
    box-shadow:0 0 0 8px rgba(192,69,58,.18), 0 8px 18px -6px rgba(0,0,0,.4);
  }
  .fab-add svg{ stroke:#fff; }

  /* Chat bubble, floats above the PTT dock */
  .chat-fab{
    position:absolute;
    right:26px;
    bottom:96px;
    width:48px;height:48px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 18px -6px rgba(0,0,0,.35);
    z-index:3;
  }
  .chat-fab svg{ stroke:#fff; }

  .fab-mic{
    right:20px;
    z-index:3;
    background:var(--accent);
    transition:background .18s ease, transform .18s ease;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  .fab-mic svg{ stroke:#fff; transition:transform .18s ease; }
  .fab-mic.live{
    transform:scale(.94);
  }
  .fab-mic .ring{
    position:absolute;
    inset:-6px;
    border-radius:50%;
    border:2px solid var(--accent);
    opacity:0;
  }
  .fab-mic.live .ring{
    animation:pulse 1.15s ease-out infinite;
  }
  @keyframes pulse{
    0%{ opacity:.55; transform:scale(.9); }
    100%{ opacity:0; transform:scale(1.5); }
  }
  @media (prefers-reduced-motion: reduce){
    .fab-mic.live .ring{ animation:none; opacity:.35; }
  }

  /* Channel dock — white capsule tucked under the mic.
     Always present while a channel is open. No text by design:
     "…" = channel open & quiet, waveform = audio on the channel. */
  .talk-pill{
    position:absolute;
    right:20px;
    bottom:22px;
    height:60px;
    box-sizing:border-box;
    min-width:150px;
    padding:0 74px 0 22px;
    background:var(--card);
    border-radius:30px;
    box-shadow:0 8px 18px -6px rgba(0,0,0,.28);
    display:flex;
    align-items:center;
    justify-content:flex-start;
    z-index:2;
  }

  /* Idle: three quiet dots */
  .pill-dots{
    display:flex;
    align-items:center;
    gap:5px;
  }
  .pill-dots span{
    width:7px;height:7px;border-radius:50%;
    background:var(--accent);
  }

  /* Active: waveform */
  .bars{
    display:none;
    align-items:center;
    gap:3px;
    height:20px;
  }
  .bars span{
    width:3.5px;
    background:var(--accent);
    border-radius:2px;
    animation:bar 0.9s ease-in-out infinite;
  }
  .bars span:nth-child(1){ height:45%; animation-delay:0s; }
  .bars span:nth-child(2){ height:100%; animation-delay:.15s; }
  .bars span:nth-child(3){ height:70%; animation-delay:.3s; }
  .bars span:nth-child(4){ height:90%; animation-delay:.45s; }
  @keyframes bar{
    0%,100%{ transform:scaleY(.4); }
    50%{ transform:scaleY(1); }
  }

  .talk-pill.active .pill-dots{ display:none; }
  .talk-pill.active .bars{ display:flex; }

  /* Bottom tab bar */
  .tabbar{
    display:flex;
    flex-direction:row-reverse;
    justify-content:space-around;
    align-items:center;
    padding:10px 8px calc(16px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    flex-shrink:0;
    background:var(--card);
  }
  .tab{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
  }
  .tab svg{ stroke:var(--muted); }
  .tab.active svg{ stroke:var(--accent); }
  .tab-label{
    width:26px;height:6px;
    border-radius:3px;
    background:var(--line-soft);
  }
  .tab.active .tab-label{ background:var(--accent); opacity:.5; }

  .hint{
    font-size:11px;
    color:var(--muted);
    max-width:300px;
    text-align:center;
    line-height:1.5;
  }
</style>
</head>
<body>
<div class="phone">
    <div class="topbar">
      <div class="avatar"></div>
      <div class="search"></div>
      <div class="burger"><span></span><span></span><span></span></div>
    </div>

    <div class="status-card">
      <div class="status-row1">
        <div class="status-icon-btn"></div>
        <div class="status-icon-btn"></div>
        <div class="status-flag">פעיל</div>
        <div class="status-title">הקפצה מותאמת</div>
        <div class="status-alert"></div>
      </div>
      <div class="status-sub">13:14 · הדרכות דניאל</div>
      <div class="status-row2">
        <span class="pill">2</span>
        <span class="pill">0</span>
        <span class="pill">0</span>
        <span class="pill">0</span>
        <span class="divider"></span>
        <span class="pill">1</span>
        <span class="pill">0</span>
      </div>
    </div>

    <div class="map">
      <div class="zone"></div>
      <div class="pin pin-a"></div>
      <div class="pin pin-b"></div>

      <div class="map-tools">
        <div class="tool"></div>
        <div class="tool"></div>
        <div class="tool"></div>
      </div>

      <button class="chat-fab" aria-label="צ׳אט">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.3-.6L3 21l1.8-5A8.3 8.3 0 0 1 4 11.5a8.4 8.4 0 0 1 8.5-8.4h.5a8.4 8.4 0 0 1 8 8.4z"/></svg>
      </button>

      <div class="talk-pill" id="pill">
        <span class="pill-dots"><span></span><span></span><span></span></span>
        <span class="bars"><span></span><span></span><span></span><span></span></span>
      </div>

      <button class="fab fab-add" aria-label="הוספה">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>

      <button class="fab fab-mic" id="micBtn" type="button" aria-label="החזק כדי לדבר" aria-pressed="false">
        <span class="ring"></span>
        <svg id="micIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0"/>
          <path d="M12 18v3"/>
        </svg>
      </button>
    </div>

    <div class="tabbar">
      <div class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 4h16v12H8l-4 4z"/></svg><span class="tab-label"></span></div>
      <div class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/></svg><span class="tab-label"></span></div>
      <div class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M6 3h9l3 3v15H6z"/></svg><span class="tab-label"></span></div>
      <div class="tab active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span class="tab-label"></span></div>
    </div>
  </div>

<script>
  var micBtn = document.getElementById('micBtn');
  var pill = document.getElementById('pill');
  var ptteLive = false;
  var audioCtx = null;

  // One short blip, scheduled `offset` seconds from now.
  function tone(freq, offset) {
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    var t0 = audioCtx.currentTime + (offset || 0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.5, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.11);
  }

  var TONE_ON = 1046.5;  // C6 — single chirp when transmission starts
  var TONE_OFF = 659.25; // E5 — doubled "bip bip" when transmission ends

  // Each entry is [frequency, delay-in-seconds].
  function playBlips(blips) {
    function fire() {
      for (var i = 0; i < blips.length; i++) tone(blips[i][0], blips[i][1]);
    }
    try {
      if (!audioCtx) {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().then(fire);
      } else {
        fire();
      }
    } catch (err) {}
  }

  function startTalk(e) {
    if (e) e.preventDefault();
    if (ptteLive) return;
    ptteLive = true;
    micBtn.classList.add('live');
    micBtn.setAttribute('aria-pressed', 'true');
    pill.classList.add('active');
    playBlips([[TONE_ON, 0]]);
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (err) {}
  }

  function stopTalk(e) {
    if (e) e.preventDefault();
    if (!ptteLive) return;
    ptteLive = false;
    micBtn.classList.remove('live');
    micBtn.setAttribute('aria-pressed', 'false');
    pill.classList.remove('active');
    playBlips([[TONE_OFF, 0], [TONE_OFF, 0.15]]); // bip bip
    try { if (navigator.vibrate) navigator.vibrate(6); } catch (err) {}
  }

  function isInsideRect(x, y, rect) {
    return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
  }

  // Pointer Events (modern browsers, incl. iOS/Android Safari & Chrome)
  micBtn.addEventListener('pointerdown', startTalk);
  micBtn.addEventListener('pointerup', stopTalk);
  micBtn.addEventListener('pointerleave', stopTalk);
  micBtn.addEventListener('pointercancel', stopTalk);

  // Touch Events fallback (belt-and-suspenders for older/quirky WebViews)
  micBtn.addEventListener('touchstart', startTalk, { passive: false });
  micBtn.addEventListener('touchend', stopTalk, { passive: false });
  micBtn.addEventListener('touchcancel', stopTalk, { passive: false });
  micBtn.addEventListener('touchmove', function (e) {
    if (!ptteLive || !e.touches || !e.touches[0]) return;
    var rect = micBtn.getBoundingClientRect();
    var t = e.touches[0];
    if (!isInsideRect(t.clientX, t.clientY, rect)) stopTalk(e);
  }, { passive: false });

  // Mouse Events fallback (desktop / environments without pointer events)
  micBtn.addEventListener('mousedown', startTalk);
  window.addEventListener('mouseup', stopTalk);
  micBtn.addEventListener('mouseleave', stopTalk);

  // Safety net: if the finger/mouse is released anywhere off-element, don't get stuck "live"
  window.addEventListener('pointerup', stopTalk);
  window.addEventListener('touchend', stopTalk, { passive: false });

  micBtn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  micBtn.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'Enter') startTalk(e);
  });
  micBtn.addEventListener('keyup', function (e) {
    if (e.code === 'Space' || e.code === 'Enter') stopTalk(e);
  });
</script>
</body>
</html>
