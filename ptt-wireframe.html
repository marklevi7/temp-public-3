<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>NETS PTT — Map Wireframe</title>
<style>
  html,body{ margin:0; padding:0; }
  :root{
    --ink:#26303a;
    --line:#b8c0c9;
    --line-soft:#dfe4e9;
    --paper:#eef1f4;
    --card:#ffffff;
    --muted:#6b7684;
    --accent:#1f6f8b;
    --accent-soft:#d8ebf1;
    --danger:#c0453a;
    --danger-soft:#f6dcd8;
    --lock:#9aa4ae;
  }
  /* Light-only by design, matching the reference app screen. */

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    background:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    overflow:hidden;
  }

  .phone{
    width:100%;
    height:100vh;
    height:100dvh;
    background:var(--card);
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }

  /* Top bar */
  .topbar{
    display:flex;
    flex-direction:row-reverse;
    align-items:center;
    gap:10px;
    padding:calc(16px + env(safe-area-inset-top)) 14px 10px;
    flex-shrink:0;
  }
  .avatar{
    width:38px;height:38px;border-radius:50%;
    background:var(--line-soft);
    border:1px solid var(--line);
    flex-shrink:0;
  }
  .search{
    flex:1;
    height:36px;
    border-radius:18px;
    background:var(--paper);
    border:1px solid var(--line);
  }
  .burger{
    width:22px;height:16px;
    flex-shrink:0;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .burger span{display:block;height:2px;background:var(--muted);border-radius:1px;}

  /* Status card */
  .status-card{
    margin:0 14px 10px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    flex-shrink:0;
  }
  .status-row1{
    display:flex;
    flex-direction:row-reverse;
    align-items:center;
    gap:8px;
  }
  .status-icon-btn{
    width:26px;height:26px;border-radius:8px;
    border:1px solid var(--line);
    background:var(--paper);
    flex-shrink:0;
  }
  .status-title{
    flex:1;
    border-radius:6px;
    margin:0 4px;
    font-size:14px;
    font-weight:700;
    text-align:right;
  }
  .status-flag{
    height:20px;
    padding:0 8px;
    border-radius:10px;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:10px;
    display:flex;
    align-items:center;
    font-weight:600;
    white-space:nowrap;
  }
  .status-alert{
    width:26px;height:26px;border-radius:8px;
    background:var(--danger);
    flex-shrink:0;
  }
  .status-sub{
    margin-top:6px;
    font-size:12px;
    color:var(--muted);
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .status-row2{
    display:flex;
    flex-direction:row-reverse;
    align-items:center;
    gap:6px;
    margin-top:10px;
  }
  .pill{
    width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;
    background:var(--line-soft);
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .status-row2 .divider{
    flex:1;
  }

  /* Map area */
  .map{
    position:relative;
    flex:1;
    background:
      repeating-linear-gradient(0deg, var(--line-soft) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, var(--line-soft) 0 1px, transparent 1px 34px),
      var(--paper);
    overflow:hidden;
  }
  .map::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(120deg, transparent 55%, var(--line-soft) 56%, var(--line-soft) 58%, transparent 59%),
      linear-gradient(35deg, transparent 70%, var(--line-soft) 71%, var(--line-soft) 73%, transparent 74%);
    opacity:.7;
  }
  .zone{
    position:absolute;
    top:30%;
    left:34%;
    width:32%;
    height:26%;
    background:var(--accent-soft);
    border:1.5px dashed var(--accent);
    border-radius:4px;
    opacity:.8;
  }
  .pin{
    position:absolute;
    width:30px;height:30px;
    border-radius:8px 8px 8px 2px;
    background:var(--card);
    border:1px solid var(--line);
    transform:rotate(45deg);
  }
  .pin.pin-a{ top:24%; left:44%; }
  .pin.pin-b{ top:38%; left:38%; }

  .map-tools{
    position:absolute;
    top:14px;
    right:14px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .map-tools .tool{
    width:34px;height:34px;
    border-radius:9px;
    background:var(--card);
    border:1px solid var(--line);
  }

  /* Floating actions */
  .fab{
    position:absolute;
    bottom:22px;
    width:60px;height:60px;
    border-radius:50%;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 18px -6px rgba(0,0,0,.4);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .fab-add{
    left:20px;
    background:var(--danger);
    box-shadow:0 0 0 8px rgba(192,69,58,.18), 0 8px 18px -6px rgba(0,0,0,.4);
  }
  .fab-add svg{ stroke:#fff; }

  /* Chat bubble, floats above the PTT dock */
  .chat-fab{
    position:absolute;
    right:26px;
    bottom:96px;
    width:48px;height:48px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 18px -6px rgba(0,0,0,.35);
    z-index:3;
  }
  .chat-fab svg{ stroke:#fff; }

  .fab-mic{
    right:20px;
    z-index:3;
    background:var(--accent);
    transition:background .18s ease, transform .18s ease;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  .fab-mic svg{ stroke:#fff; transition:transform .18s ease; }
  .fab-mic.live{
    transform:scale(.94);
  }

  /* B2 — someone else holds the floor: mic is locked out and shows a speaker. */
  .fab-mic.locked{
    background:var(--lock);
    box-shadow:0 6px 14px -8px rgba(0,0,0,.45);
    cursor:not-allowed;
  }
  #micIcon{ display:block; }
  #spkIcon{ display:none; }
  .fab-mic.locked #micIcon{ display:none; }
  .fab-mic.locked #spkIcon{ display:block; }
  .fab-mic .ring{
    position:absolute;
    inset:-6px;
    border-radius:50%;
    border:2px solid var(--accent);
    opacity:0;
  }
  .fab-mic.live .ring{
    animation:pulse 1.15s ease-out infinite;
  }
  @keyframes pulse{
    0%{ opacity:.55; transform:scale(.9); }
    100%{ opacity:0; transform:scale(1.5); }
  }
  @media (prefers-reduced-motion: reduce){
    .fab-mic.live .ring{ animation:none; opacity:.35; }
  }

  /* Channel dock — white capsule tucked under the mic.
     Always present while a channel is open. No text by design:
     "…" = channel open & quiet, waveform = audio on the channel. */
  .talk-pill{
    position:absolute;
    right:20px;
    bottom:22px;
    height:60px;
    box-sizing:border-box;
    min-width:127px;
    padding:0 74px 0 22px;
    background:var(--card);
    border-radius:30px;
    box-shadow:0 8px 18px -6px rgba(0,0,0,.28);
    display:flex;
    align-items:center;
    justify-content:flex-start;
    z-index:2;
  }

  /* Three dots at rest; each stretches into a vertical rounded bar
     while recording, driven by the live mic level. */
  .pill-dots{
    display:flex;
    align-items:center;
    gap:5px;
    height:34px;
  }
  .pill-dots span{
    width:7px;
    height:7px;
    border-radius:4px;
    background:var(--accent);
    transition:height .06s linear;
  }

  /* Active: waveform */
  .bars{
    display:none;
    align-items:center;
    gap:3px;
    height:20px;
  }
  .bars span{
    width:3.5px;
    background:var(--accent);
    border-radius:2px;
    animation:bar 0.9s ease-in-out infinite;
  }
  .bars span:nth-child(1){ height:45%; animation-delay:0s; }
  .bars span:nth-child(2){ height:100%; animation-delay:.15s; }
  .bars span:nth-child(3){ height:70%; animation-delay:.3s; }
  .bars span:nth-child(4){ height:90%; animation-delay:.45s; }
  @keyframes bar{
    0%,100%{ transform:scaleY(.4); }
    50%{ transform:scaleY(1); }
  }

  /* B2 — incoming: who is talking, in a darker "not you" treatment */
  .pill-speaker{
    display:none;
    align-items:center;
    gap:8px;
  }
  .spk-avatar{
    position:relative;
    width:34px;height:34px;border-radius:50%;
    background:var(--line-soft);
    border:1px solid var(--line);
    display:flex;align-items:flex-end;justify-content:center;
    overflow:hidden;
    flex-shrink:0;
  }
  .face{ width:100%; height:100%; object-fit:cover; display:block; }
  /* red "on air" badge, same language as the map marker */
  .spk-avatar::after{
    content:"";
    position:absolute;
    right:0;bottom:0;
    width:11px;height:11px;
    border-radius:50%;
    background:var(--danger);
    border:2px solid var(--card);
  }
  .spk-name{
    font-size:12px;
    font-weight:700;
    color:var(--ink);
    white-space:nowrap;
  }

  /* Idle heartbeat: a short double-hop every 5s so the channel reads as alive */
  .talk-pill:not(.active):not(.rx) .pill-dots span{
    animation:dotHop 6s ease-in-out infinite;
  }
  .talk-pill:not(.active):not(.rx) .pill-dots span:nth-child(2){ animation-delay:.09s; }
  .talk-pill:not(.active):not(.rx) .pill-dots span:nth-child(3){ animation-delay:.18s; }
  @keyframes dotHop{
    0%,  100%{ transform:translateY(0); }
    4%       { transform:translateY(-6px); }
    8%       { transform:translateY(0); }
    12%      { transform:translateY(-6px); }
    16%      { transform:translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .talk-pill .pill-dots span{ animation:none; }
  }

  /* Transmitting: the same three dots become level meters (JS sets height) */
  .talk-pill.active .bars{ display:none; }

  .talk-pill.rx{ padding-left:16px; }
  .talk-pill.rx .pill-dots{ display:none; }
  .talk-pill.rx .pill-speaker{ display:flex; }
  .talk-pill.rx .bars{ display:flex; }
  .talk-pill.rx .bars span{ background:var(--ink); }
  /* while receiving, JS sets these heights from the live audio level */
  .talk-pill.rx .bars span,
  .map.rx .marker-badge i{ animation:none; }

  /* Team members on the map. Always visible; the one who is talking
     grows an "on air" waveform badge while transmitting. */
  .talker-marker{
    position:absolute;
    display:flex;
    align-items:center;
    gap:6px;
    z-index:1;
  }
  .talker-marker.m1{ top:34%; left:46%; }
  .talker-marker.m2{ top:22%; left:20%; }
  .talker-marker.m3{ top:56%; left:64%; }
  .marker-badge{
    width:30px;height:30px;border-radius:50%;
    background:var(--accent);
    display:none;
    align-items:center;justify-content:center;
    gap:2px;
    box-shadow:0 3px 8px -3px rgba(0,0,0,.5);
  }
  .map.rx .talker-marker.m1 .marker-badge{ display:flex; }
  /* the speaker is highlighted; everyone else sits back */
  .map.rx .talker-marker:not(.m1) .marker-face{ opacity:.55; }
  .talker-marker.m1 .marker-face{ transition:border-color .2s ease; }
  .map.rx .talker-marker.m1 .marker-face{ border-color:var(--danger); }
  .marker-badge i{
    display:block;
    width:3px;
    background:#fff;
    border-radius:2px;
    animation:bar .9s ease-in-out infinite;
  }
  .marker-badge i:nth-child(1){ height:8px; animation-delay:0s; }
  .marker-badge i:nth-child(2){ height:14px; animation-delay:.15s; }
  .marker-badge i:nth-child(3){ height:9px; animation-delay:.3s; }
  .initials{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:13px;font-weight:700;
  }
  .initials.alt{
    background:var(--line-soft);
    color:var(--muted);
  }
  .marker-face{
    width:38px;height:38px;
    border-radius:50%;
    background:var(--card);
    border:2px solid var(--accent);
    display:flex;align-items:flex-end;justify-content:center;
    overflow:hidden;
  }

  /* Prototype-only control for demoing the incoming state */
  .sim-btn{
    position:absolute;
    top:14px;
    left:14px;
    height:30px;
    padding:0 12px;
    border-radius:15px;
    border:1px dashed var(--line);
    background:rgba(255,255,255,.9);
    color:var(--muted);
    font-size:11px;
    font-weight:600;
    font-family:inherit;
    display:flex;align-items:center;gap:6px;
    z-index:4;
    cursor:pointer;
  }
  .sim-btn:disabled{ opacity:.45; }

  /* Why the mic meter isn't moving, when it isn't */
  .mic-note{
    position:absolute;
    top:52px;
    left:14px;
    right:14px;
    padding:8px 12px;
    border-radius:10px;
    background:var(--danger);
    color:#fff;
    font-size:11px;
    font-weight:600;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
    z-index:5;
  }
  .mic-note.show{ opacity:1; }

  /* Bottom tab bar */
  .tabbar{
    display:flex;
    flex-direction:row-reverse;
    justify-content:space-around;
    align-items:center;
    padding:10px 8px calc(16px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    flex-shrink:0;
    background:var(--card);
  }
  .tab{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
  }
  .tab svg{ stroke:var(--muted); }
  .tab.active svg{ stroke:var(--accent); }
  .tab-label{
    width:26px;height:6px;
    border-radius:3px;
    background:var(--line-soft);
  }
  .tab.active .tab-label{ background:var(--accent); opacity:.5; }

  .hint{
    font-size:11px;
    color:var(--muted);
    max-width:300px;
    text-align:center;
    line-height:1.5;
  }
</style>
</head>

<script>
  var micBtn = document.getElementById('micBtn');
  var pill = document.getElementById('pill');
  var ptteLive = false;
  var audioCtx = null;

  // One short blip, scheduled `offset` seconds from now.
  function tone(freq, offset, len, peak) {
    var d = len || 0.1;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    var t0 = audioCtx.currentTime + (offset || 0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peak || 0.5, t0 + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + d + 0.01);
  }

  // Start sending: rising D# – G – C', the "you are on air" cue.
  var TONE_ON = [
    [622.25,  0,    0.065, 0.40],  // D#5
    [783.99,  0.07, 0.065, 0.50],  // G5
    [1046.50, 0.14, 0.11,  0.60]   // C6
  ];

  // Rising do–fa–do', a full octave, played when a transmission ends.
  // The octave jump makes the climb unmistakable.
  var STEP = 0.07;
  var TONE_OFF = [
    // freq, delay, length, peak gain — gain climbs so the rise reads clearly
    [1046.50, 0,        0.065, 0.55],  // C6
    [783.99,  STEP,     0.065, 0.50],  // G5
    [622.25,  STEP * 2, 0.11,  0.46]   // D#5
  ];

  // Falling do–fa–do, played when an INCOMING transmission ends.
  // Mirror image of TONE_OFF: theirs descends, yours climbs.
  var TONE_RX_END = [
    [1046.50, 0,        0.065, 0.46],  // do'  — C6
    [698.46,  STEP,     0.065, 0.48],  // fa   — F5
    [523.25,  STEP * 2, 0.11,  0.50]   // do   — C5, an octave down
  ];

  // Each entry is [frequency, delay-in-seconds].
  function playBlips(blips) {
    function fire() {
      for (var i = 0; i < blips.length; i++) {
        tone(blips[i][0], blips[i][1], blips[i][2], blips[i][3]);
      }
    }
    try {
      if (!audioCtx) {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().then(fire);
      } else {
        fire();
      }
    } catch (err) {}
  }

  // ---- B2: receiving a transmission from someone else -------------------
  var simBtn = document.getElementById('simBtn');
  var incoming = document.getElementById('incomingAudio');
  var receiving = false;

  var TONE_RX = 880; // A5 — incoming chirp, plays just before their audio

  // Incoming audio drives the pill waveform and the map badge, so the bars
  // track what is actually being said rather than looping on their own.
  var rxSrc = null, rxAnalyser = null, rxRaf = null;
  var rxBars = document.querySelectorAll('.talk-pill .bars span');
  var mkBars = document.querySelectorAll('.marker-badge i');
  var RX_BANDS4 = [[2, 8], [8, 18], [18, 34], [34, 64]];
  var RX_BANDS3 = [[2, 10], [10, 28], [28, 64]];

  function driveIncoming() {
    if (!audioCtx) return;
    try {
      if (!rxSrc) {
        rxSrc = audioCtx.createMediaElementSource(incoming);
        rxSrc.connect(audioCtx.destination);
        rxAnalyser = audioCtx.createAnalyser();
        rxAnalyser.fftSize = 256;
        rxAnalyser.smoothingTimeConstant = 0.6;
        rxSrc.connect(rxAnalyser);
      }
    } catch (err) { return; }
    var data = new Uint8Array(rxAnalyser.frequencyBinCount);
    function level(range) {
      var s = 0, n = 0;
      for (var j = range[0]; j < range[1]; j++) { s += data[j]; n++; }
      return Math.min(1, (s / n / 255) * 2.4);
    }
    (function tick() {
      rxAnalyser.getByteFrequencyData(data);
      for (var i = 0; i < rxBars.length; i++) {
        rxBars[i].style.height = (4 + level(RX_BANDS4[i]) * 18).toFixed(1) + 'px';
      }
      for (var k = 0; k < mkBars.length; k++) {
        mkBars[k].style.height = (4 + level(RX_BANDS3[k]) * 14).toFixed(1) + 'px';
      }
      rxRaf = requestAnimationFrame(tick);
    })();
  }

  function stopIncomingMeter() {
    if (rxRaf) { cancelAnimationFrame(rxRaf); rxRaf = null; }
    for (var i = 0; i < rxBars.length; i++) rxBars[i].style.height = '';
    for (var k = 0; k < mkBars.length; k++) mkBars[k].style.height = '';
  }

  function startReceiving() {
    if (receiving || ptteLive) return;
    receiving = true;
    pill.classList.add('rx');
    document.querySelector('.map').classList.add('rx');
    micBtn.classList.add('locked');
    micBtn.setAttribute('aria-disabled', 'true');
    simBtn.disabled = true;
    playBlips([[TONE_RX, 0]]);
    // let the chirp land before their voice starts
    setTimeout(function () {
      if (!receiving) return;
      try {
        incoming.currentTime = 0;
        incoming.playbackRate = 1; // speed is already baked into the clip
        incoming.play();
        driveIncoming();
      } catch (err) {}
    }, 260);
  }

  function stopReceiving() {
    if (!receiving) return;
    receiving = false;
    pill.classList.remove('rx');
    document.querySelector('.map').classList.remove('rx');
    micBtn.classList.remove('locked');
    micBtn.removeAttribute('aria-disabled');
    simBtn.disabled = false;
    stopIncomingMeter();
    try { incoming.pause(); incoming.currentTime = 0; } catch (err) {}
    playBlips(TONE_RX_END); // falling do-fa-do — they finished talking
  }

  simBtn.addEventListener('click', startReceiving);
  incoming.addEventListener('ended', stopReceiving);
  // safety net if the clip can't load
  incoming.addEventListener('error', function () {
    setTimeout(stopReceiving, 3000);
  });

  // ---- B1: real microphone capture + live level on the dots --------------
  var dotEls = document.querySelectorAll('.pill-dots span');
  var micStream = null;
  var recorder = null;
  var chunks = [];
  var analyser = null;
  var rafId = null;
  var micDenied = false;
  var playback = new Audio();

  var DOT_MIN = 7;
  var DOT_MAX = 34;

  function setDot(i, level) {
    var h = DOT_MIN + Math.max(0, Math.min(1, level)) * (DOT_MAX - DOT_MIN);
    dotEls[i].style.height = h.toFixed(1) + 'px';
  }

  function resetDots() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    for (var i = 0; i < dotEls.length; i++) dotEls[i].style.height = '';
  }

  // Three frequency bands -> three dots, so they move independently.
  var BANDS = [[2, 9], [9, 26], [26, 64]];

  function driveDots(sourceNode) {
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.55;
    sourceNode.connect(analyser);
    var data = new Uint8Array(analyser.frequencyBinCount);
    (function tick() {
      analyser.getByteFrequencyData(data);
      for (var i = 0; i < 3; i++) {
        var sum = 0, n = 0;
        for (var j = BANDS[i][0]; j < BANDS[i][1]; j++) { sum += data[j]; n++; }
        setDot(i, (sum / n / 255) * 2.4);
      }
      rafId = requestAnimationFrame(tick);
    })();
  }

  // No fake motion: if the mic is unavailable the dots stay put and say so,
  // otherwise a blocked mic looks identical to a working one.
  var micNoteTimer = null;
  function micUnavailable(why) {
    var el = document.getElementById('micNote');
    el.textContent = why;
    el.classList.add('show');
    clearTimeout(micNoteTimer);
    micNoteTimer = setTimeout(function () { el.classList.remove('show'); }, 3500);
  }

  // Acquired once and reused for the whole session.
  var streamPromise = null;
  function ensureStream() {
    if (micStream && micStream.active) return Promise.resolve(micStream);
    if (!streamPromise) {
      streamPromise = navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function (s) { micStream = s; return s; })
        .catch(function (e) { streamPromise = null; throw e; });
    }
    return streamPromise;
  }

  function beginCapture() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      micUnavailable('אין תמיכה במיקרופון בדפדפן הזה');
      return;
    }
    if (!window.isSecureContext && location.protocol !== 'file:') {
      micUnavailable('נדרש חיבור מאובטח (HTTPS) לגישה למיקרופון');
      return;
    }
    ensureStream().then(function (stream) {
      // The permission prompt blocks the page, so the finger is often already
      // up by the time this resolves. Keep the stream either way and only skip
      // the meter — otherwise the very first press can never work.
      if (!ptteLive) return;
      if (!audioCtx) {
        micUnavailable('אין הקשר אודיו');
        return;
      }
      if (audioCtx.state === 'suspended') { audioCtx.resume(); }
      driveDots(audioCtx.createMediaStreamSource(stream));
      chunks = [];
      try {
        recorder = new MediaRecorder(stream);
        recorder.ondataavailable = function (ev) {
          if (ev.data && ev.data.size) chunks.push(ev.data);
        };
        recorder.onstop = function () {
          if (!chunks.length) return;
          playback.src = URL.createObjectURL(new Blob(chunks, { type: chunks[0].type }));
          // let the release tone finish, then play back what was captured
          setTimeout(function () { playback.play().catch(function () {}); }, 260);
        };
        recorder.start();
      } catch (err) { recorder = null; }
    }).catch(function (err) {
      micDenied = true;
      var name = (err && err.name) || '';
      if (name === 'NotAllowedError') {
        micUnavailable('הגישה למיקרופון נחסמה — פתחו בדפדפן');
      } else if (name === 'NotFoundError') {
        micUnavailable('לא נמצא מיקרופון');
      } else {
        micUnavailable('המיקרופון לא זמין: ' + (name || 'שגיאה'));
      }
    });
  }

  function endCapture() {
    resetDots();
    try { if (recorder && recorder.state === 'recording') recorder.stop(); } catch (err) {}
    recorder = null;
    // Deliberately keep micStream alive: re-acquiring on every release
    // re-triggers the permission race and kills the next press.
  }

  function startTalk(e) {
    if (e) e.preventDefault();
    // B2: you cannot transmit over someone who already holds the floor
    if (receiving) return;
    if (ptteLive) return;
    ptteLive = true;
    micBtn.classList.add('live');
    micBtn.setAttribute('aria-pressed', 'true');
    pill.classList.add('active');
    playBlips(TONE_ON);
    try { playback.pause(); } catch (err) {}
    beginCapture();
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (err) {}
  }

  function stopTalk(e) {
    if (e) e.preventDefault();
    if (!ptteLive) return;
    ptteLive = false;
    micBtn.classList.remove('live');
    micBtn.setAttribute('aria-pressed', 'false');
    pill.classList.remove('active');
    endCapture();
    playBlips(TONE_OFF); // rising do-fa-do'
    try { if (navigator.vibrate) navigator.vibrate(6); } catch (err) {}
  }

  function isInsideRect(x, y, rect) {
    return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
  }

  // Pointer Events (modern browsers, incl. iOS/Android Safari & Chrome)
  micBtn.addEventListener('pointerdown', startTalk);
  micBtn.addEventListener('pointerup', stopTalk);
  micBtn.addEventListener('pointerleave', stopTalk);
  micBtn.addEventListener('pointercancel', stopTalk);

  // Touch Events fallback (belt-and-suspenders for older/quirky WebViews)
  micBtn.addEventListener('touchstart', startTalk, { passive: false });
  micBtn.addEventListener('touchend', stopTalk, { passive: false });
  micBtn.addEventListener('touchcancel', stopTalk, { passive: false });
  micBtn.addEventListener('touchmove', function (e) {
    if (!ptteLive || !e.touches || !e.touches[0]) return;
    var rect = micBtn.getBoundingClientRect();
    var t = e.touches[0];
    if (!isInsideRect(t.clientX, t.clientY, rect)) stopTalk(e);
  }, { passive: false });

  // Mouse Events fallback (desktop / environments without pointer events)
  micBtn.addEventListener('mousedown', startTalk);
  window.addEventListener('mouseup', stopTalk);
  micBtn.addEventListener('mouseleave', stopTalk);

  // Safety net: if the finger/mouse is released anywhere off-element, don't get stuck "live"
  window.addEventListener('pointerup', stopTalk);
  window.addEventListener('touchend', stopTalk, { passive: false });

  // Ask for the mic on the first touch anywhere, so the permission dialog
  // isn't racing the first press-and-hold.
  document.addEventListener('pointerdown', function prime() {
    document.removeEventListener('pointerdown', prime, true);
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      ensureStream().catch(function () {});
    }
  }, true);

  micBtn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  micBtn.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'Enter') startTalk(e);
  });
  micBtn.addEventListener('keyup', function (e) {
    if (e.code === 'Space' || e.code === 'Enter') stopTalk(e);
  });
</script>
