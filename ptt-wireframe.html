<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>NETS PTT — Map Wireframe</title>
<style>
  html,body{ margin:0; padding:0; }
  :root{
    --ink:#26303a;
    --line:#b8c0c9;
    --line-soft:#dfe4e9;
    --paper:#eef1f4;
    --card:#ffffff;
    --muted:#6b7684;
    --accent:#1f6f8b;
    --accent-soft:#d8ebf1;
    --danger:#c0453a;
    --danger-soft:#f6dcd8;
    --lock:#9aa4ae;
  }
  /* Light-only by design, matching the reference app screen. */

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    background:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    overflow:hidden;
  }

  .phone{
    width:100%;
    height:100vh;
    height:100dvh;
    background:var(--card);
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }

  /* Top bar */
  .topbar{
    display:flex;
    flex-direction:row-reverse;
    align-items:center;
    gap:10px;
    padding:calc(16px + env(safe-area-inset-top)) 14px 10px;
    flex-shrink:0;
  }
  .avatar{
    width:38px;height:38px;border-radius:50%;
    background:var(--line-soft);
    border:1px solid var(--line);
    flex-shrink:0;
  }
  .search{
    flex:1;
    height:36px;
    border-radius:18px;
    background:var(--paper);
    border:1px solid var(--line);
  }
  .burger{
    width:22px;height:16px;
    flex-shrink:0;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .burger span{display:block;height:2px;background:var(--muted);border-radius:1px;}

  /* Status card */
  .status-card{
    margin:0 14px 10px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    flex-shrink:0;
  }
  .status-row1{
    display:flex;
    flex-direction:row-reverse;
    align-items:center;
    gap:8px;
  }
  .status-icon-btn{
    width:26px;height:26px;border-radius:8px;
    border:1px solid var(--line);
    background:var(--paper);
    flex-shrink:0;
  }
  .status-title{
    flex:1;
    border-radius:6px;
    margin:0 4px;
    font-size:14px;
    font-weight:700;
    text-align:right;
  }
  .status-flag{
    height:20px;
    padding:0 8px;
    border-radius:10px;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:10px;
    display:flex;
    align-items:center;
    font-weight:600;
    white-space:nowrap;
  }
  .status-alert{
    width:26px;height:26px;border-radius:8px;
    background:var(--danger);
    flex-shrink:0;
  }
  .status-sub{
    margin-top:6px;
    font-size:12px;
    color:var(--muted);
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .status-row2{
    display:flex;
    flex-direction:row-reverse;
    align-items:center;
    gap:6px;
    margin-top:10px;
  }
  .pill{
    width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;
    background:var(--line-soft);
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .status-row2 .divider{
    flex:1;
  }

  /* Map area */
  .map{
    position:relative;
    flex:1;
    background:
      repeating-linear-gradient(0deg, var(--line-soft) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, var(--line-soft) 0 1px, transparent 1px 34px),
      var(--paper);
    overflow:hidden;
  }
  .map::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(120deg, transparent 55%, var(--line-soft) 56%, var(--line-soft) 58%, transparent 59%),
      linear-gradient(35deg, transparent 70%, var(--line-soft) 71%, var(--line-soft) 73%, transparent 74%);
    opacity:.7;
  }
  .zone{
    position:absolute;
    top:30%;
    left:34%;
    width:32%;
    height:26%;
    background:var(--accent-soft);
    border:1.5px dashed var(--accent);
    border-radius:4px;
    opacity:.8;
  }
  .pin{
    position:absolute;
    width:30px;height:30px;
    border-radius:8px 8px 8px 2px;
    background:var(--card);
    border:1px solid var(--line);
    transform:rotate(45deg);
  }
  .pin.pin-a{ top:24%; left:44%; }
  .pin.pin-b{ top:38%; left:38%; }

  .map-tools{
    position:absolute;
    top:14px;
    right:14px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .map-tools .tool{
    width:34px;height:34px;
    border-radius:9px;
    background:var(--card);
    border:1px solid var(--line);
  }

  /* Floating actions */
  .fab{
    position:absolute;
    bottom:22px;
    width:60px;height:60px;
    border-radius:50%;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 18px -6px rgba(0,0,0,.4);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .fab-add{
    left:20px;
    background:var(--danger);
    box-shadow:0 0 0 8px rgba(192,69,58,.18), 0 8px 18px -6px rgba(0,0,0,.4);
  }
  .fab-add svg{ stroke:#fff; }

  /* Chat bubble, floats above the PTT dock */
  .chat-fab{
    position:absolute;
    right:26px;
    bottom:96px;
    width:48px;height:48px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 18px -6px rgba(0,0,0,.35);
    z-index:3;
  }
  .chat-fab svg{ stroke:#fff; }

  .fab-mic{
    right:20px;
    z-index:3;
    background:var(--accent);
    transition:background .18s ease, transform .18s ease;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  .fab-mic svg{ stroke:#fff; transition:transform .18s ease; }
  .fab-mic.live{
    transform:scale(.94);
  }

  /* B2 — someone else holds the floor: mic is locked out and shows a speaker. */
  .fab-mic.locked{
    background:var(--lock);
    box-shadow:0 6px 14px -8px rgba(0,0,0,.45);
    cursor:not-allowed;
  }
  #micIcon{ display:block; }
  #spkIcon{ display:none; }
  .fab-mic.locked #micIcon{ display:none; }
  .fab-mic.locked #spkIcon{ display:block; }
  .fab-mic .ring{
    position:absolute;
    inset:-6px;
    border-radius:50%;
    border:2px solid var(--accent);
    opacity:0;
  }
  .fab-mic.live .ring{
    animation:pulse 1.15s ease-out infinite;
  }
  @keyframes pulse{
    0%{ opacity:.55; transform:scale(.9); }
    100%{ opacity:0; transform:scale(1.5); }
  }
  @media (prefers-reduced-motion: reduce){
    .fab-mic.live .ring{ animation:none; opacity:.35; }
  }

  /* Channel dock — white capsule tucked under the mic.
     Always present while a channel is open. No text by design:
     "…" = channel open & quiet, waveform = audio on the channel. */
  .talk-pill{
    position:absolute;
    right:20px;
    bottom:22px;
    height:60px;
    box-sizing:border-box;
    min-width:150px;
    padding:0 74px 0 22px;
    background:var(--card);
    border-radius:30px;
    box-shadow:0 8px 18px -6px rgba(0,0,0,.28);
    display:flex;
    align-items:center;
    justify-content:flex-start;
    z-index:2;
  }

  /* Idle: three quiet dots */
  .pill-dots{
    display:flex;
    align-items:center;
    gap:5px;
  }
  .pill-dots span{
    width:7px;height:7px;border-radius:50%;
    background:var(--accent);
  }

  /* Active: waveform */
  .bars{
    display:none;
    align-items:center;
    gap:3px;
    height:20px;
  }
  .bars span{
    width:3.5px;
    background:var(--accent);
    border-radius:2px;
    animation:bar 0.9s ease-in-out infinite;
  }
  .bars span:nth-child(1){ height:45%; animation-delay:0s; }
  .bars span:nth-child(2){ height:100%; animation-delay:.15s; }
  .bars span:nth-child(3){ height:70%; animation-delay:.3s; }
  .bars span:nth-child(4){ height:90%; animation-delay:.45s; }
  @keyframes bar{
    0%,100%{ transform:scaleY(.4); }
    50%{ transform:scaleY(1); }
  }

  /* B2 — incoming: who is talking, in a darker "not you" treatment */
  .pill-speaker{
    display:none;
    align-items:center;
    gap:8px;
  }
  .spk-avatar{
    position:relative;
    width:34px;height:34px;border-radius:50%;
    background:var(--line-soft);
    border:1px solid var(--line);
    display:flex;align-items:flex-end;justify-content:center;
    overflow:hidden;
    flex-shrink:0;
  }
  .spk-avatar svg{ fill:var(--muted); opacity:.75; }
  /* red "on air" badge, same language as the map marker */
  .spk-avatar::after{
    content:"";
    position:absolute;
    right:0;bottom:0;
    width:11px;height:11px;
    border-radius:50%;
    background:var(--danger);
    border:2px solid var(--card);
  }
  .spk-name{
    font-size:12px;
    font-weight:700;
    color:var(--ink);
    white-space:nowrap;
  }

  .talk-pill.active .pill-dots{ display:none; }
  .talk-pill.active .bars{ display:flex; }

  .talk-pill.rx{ padding-left:16px; }
  .talk-pill.rx .pill-dots{ display:none; }
  .talk-pill.rx .pill-speaker{ display:flex; }
  .talk-pill.rx .bars{ display:flex; }
  .talk-pill.rx .bars span{ background:var(--ink); }

  /* Talker's position on the map, with a red "on air" badge (ref m960) */
  .talker-marker{
    position:absolute;
    top:34%;
    left:46%;
    display:none;
    align-items:center;
    gap:6px;
    z-index:1;
  }
  .map.rx .talker-marker{ display:flex; }
  .marker-badge{
    width:30px;height:30px;border-radius:50%;
    background:var(--danger);
    display:flex;align-items:center;justify-content:center;
    gap:2px;
    box-shadow:0 3px 8px -3px rgba(0,0,0,.5);
  }
  .marker-badge i{
    display:block;
    width:3px;
    background:#fff;
    border-radius:2px;
    animation:bar .9s ease-in-out infinite;
  }
  .marker-badge i:nth-child(1){ height:8px; animation-delay:0s; }
  .marker-badge i:nth-child(2){ height:14px; animation-delay:.15s; }
  .marker-badge i:nth-child(3){ height:9px; animation-delay:.3s; }
  .marker-face{
    width:38px;height:38px;
    border-radius:10px;
    background:var(--card);
    border:2px solid var(--accent);
    display:flex;align-items:flex-end;justify-content:center;
    overflow:hidden;
  }
  .marker-face svg{ fill:var(--muted); opacity:.75; }

  /* Prototype-only control for demoing the incoming state */
  .sim-btn{
    position:absolute;
    top:14px;
    left:14px;
    height:30px;
    padding:0 12px;
    border-radius:15px;
    border:1px dashed var(--line);
    background:rgba(255,255,255,.9);
    color:var(--muted);
    font-size:11px;
    font-weight:600;
    font-family:inherit;
    display:flex;align-items:center;gap:6px;
    z-index:4;
    cursor:pointer;
  }
  .sim-btn:disabled{ opacity:.45; }

  /* Bottom tab bar */
  .tabbar{
    display:flex;
    flex-direction:row-reverse;
    justify-content:space-around;
    align-items:center;
    padding:10px 8px calc(16px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    flex-shrink:0;
    background:var(--card);
  }
  .tab{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
  }
  .tab svg{ stroke:var(--muted); }
  .tab.active svg{ stroke:var(--accent); }
  .tab-label{
    width:26px;height:6px;
    border-radius:3px;
    background:var(--line-soft);
  }
  .tab.active .tab-label{ background:var(--accent); opacity:.5; }

  .hint{
    font-size:11px;
    color:var(--muted);
    max-width:300px;
    text-align:center;
    line-height:1.5;
  }
</style>
</head>

          <path d="M4 9v6h4l5 4V5L8 9H4z"/>
          <path d="M17 8.5a5 5 0 0 1 0 7"/>

      </button>
    </div>

    <div class="tabbar">

      <div class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M6 3h9l3 3v15H6z"/></svg><span class="tab-label"></span></div>

<script>
  var micBtn = document.getElementById('micBtn');
  var pill = document.getElementById('pill');
  var ptteLive = false;
  var audioCtx = null;

  // One short blip, scheduled `offset` seconds from now.
  function tone(freq, offset, len, peak) {
    var d = len || 0.1;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    var t0 = audioCtx.currentTime + (offset || 0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peak || 0.5, t0 + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + d + 0.01);
  }

  var TONE_ON = 1046.5; // C6 — single chirp when transmission starts

  // Rising do–fa–do', a full octave, played when a transmission ends.
  // The octave jump makes the climb unmistakable.
  var STEP = 0.07;
  var TONE_OFF = [
    // freq, delay, length, peak gain — gain climbs so the rise reads clearly
    [523.25,  0,        0.065, 0.38],  // do   — C5
    [698.46,  STEP,     0.065, 0.50],  // fa   — F5
    [1046.50, STEP * 2, 0.11,  0.62]   // do'  — C6, an octave above the first
  ];

  // Each entry is [frequency, delay-in-seconds].
  function playBlips(blips) {
    function fire() {
      for (var i = 0; i < blips.length; i++) {
        tone(blips[i][0], blips[i][1], blips[i][2], blips[i][3]);
      }
    }
    try {
      if (!audioCtx) {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().then(fire);
      } else {
        fire();
      }
    } catch (err) {}
  }

  // ---- B2: receiving a transmission from someone else -------------------
  var simBtn = document.getElementById('simBtn');
  var incoming = document.getElementById('incomingAudio');
  var receiving = false;

  var TONE_RX = 880; // A5 — incoming chirp, plays just before their audio

  function startReceiving() {
    if (receiving || ptteLive) return;
    receiving = true;
    pill.classList.add('rx');
    document.querySelector('.map').classList.add('rx');
    micBtn.classList.add('locked');
    micBtn.setAttribute('aria-disabled', 'true');
    simBtn.disabled = true;
    playBlips([[TONE_RX, 0]]);
    // let the chirp land before their voice starts
    setTimeout(function () {
      if (!receiving) return;
      try {
        incoming.currentTime = 0;
        incoming.playbackRate = 2;
        incoming.play();
      } catch (err) {}
    }, 260);
  }

  function stopReceiving() {
    if (!receiving) return;
    receiving = false;
    pill.classList.remove('rx');
    document.querySelector('.map').classList.remove('rx');
    micBtn.classList.remove('locked');
    micBtn.removeAttribute('aria-disabled');
    simBtn.disabled = false;
    try { incoming.pause(); incoming.currentTime = 0; } catch (err) {}
    playBlips(TONE_OFF); // rising do-re-mi — the channel is free again
  }

  simBtn.addEventListener('click', startReceiving);
  incoming.addEventListener('ended', stopReceiving);
  // safety net if the clip can't load
  incoming.addEventListener('error', function () {
    setTimeout(stopReceiving, 3000);
  });

  function startTalk(e) {
    if (e) e.preventDefault();
    // B2: you cannot transmit over someone who already holds the floor
    if (receiving) return;
    if (ptteLive) return;
    ptteLive = true;
    micBtn.classList.add('live');
    micBtn.setAttribute('aria-pressed', 'true');
    pill.classList.add('active');
    playBlips([[TONE_ON, 0]]);
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (err) {}
  }

  function stopTalk(e) {
    if (e) e.preventDefault();
    if (!ptteLive) return;
    ptteLive = false;
    micBtn.classList.remove('live');
    micBtn.setAttribute('aria-pressed', 'false');
    pill.classList.remove('active');
    playBlips(TONE_OFF); // rising do-re-mi
    try { if (navigator.vibrate) navigator.vibrate(6); } catch (err) {}
  }

  function isInsideRect(x, y, rect) {
    return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
  }

  // Pointer Events (modern browsers, incl. iOS/Android Safari & Chrome)
  micBtn.addEventListener('pointerdown', startTalk);
  micBtn.addEventListener('pointerup', stopTalk);
  micBtn.addEventListener('pointerleave', stopTalk);
  micBtn.addEventListener('pointercancel', stopTalk);

  // Touch Events fallback (belt-and-suspenders for older/quirky WebViews)
  micBtn.addEventListener('touchstart', startTalk, { passive: false });
  micBtn.addEventListener('touchend', stopTalk, { passive: false });
  micBtn.addEventListener('touchcancel', stopTalk, { passive: false });
  micBtn.addEventListener('touchmove', function (e) {
    if (!ptteLive || !e.touches || !e.touches[0]) return;
    var rect = micBtn.getBoundingClientRect();
    var t = e.touches[0];
    if (!isInsideRect(t.clientX, t.clientY, rect)) stopTalk(e);
  }, { passive: false });

  // Mouse Events fallback (desktop / environments without pointer events)
  micBtn.addEventListener('mousedown', startTalk);
  window.addEventListener('mouseup', stopTalk);
  micBtn.addEventListener('mouseleave', stopTalk);

  // Safety net: if the finger/mouse is released anywhere off-element, don't get stuck "live"
  window.addEventListener('pointerup', stopTalk);
  window.addEventListener('touchend', stopTalk, { passive: false });

  micBtn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  micBtn.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'Enter') startTalk(e);
  });
  micBtn.addEventListener('keyup', function (e) {
    if (e.code === 'Space' || e.code === 'Enter') stopTalk(e);
  });
</script>
